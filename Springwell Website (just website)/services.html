<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services & Repair | Springwell Time</title>
  <meta name="description" content="Watch battery replacement from RM25, strap replacement, bracelet resizing and battery checks at Springwell Time, Mahkota Parade Melaka.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="services" data-title="title.services">

<main id="main">
  <section class="page-hero">
    <div class="wrap info-split" style="align-items:end">
      <div>
        <p class="crumbs"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.services"></span></p>
        <p class="eyebrow" data-i18n="svc.hero.eyebrow"></p>
        <h1 class="display" data-i18n="svc.hero.title"></h1>
        <p class="lead" data-i18n="svc.hero.lead"></p>
      </div>
      <div class="btn-row" style="justify-content:flex-end">
        <a class="btn" data-wa="wa.service" href="#"><span data-icon="wa"></span><span data-i18n="svc.cta"></span></a>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="service-list">
        <div class="service reveal">
          <div class="service__icon" data-icon="battery"></div>
          <div>
            <h2 class="h3" data-i18n="svc.battery.title"></h2>
            <p data-i18n="svc.battery.text"></p>
            <span class="service__price" data-i18n="svc.from"></span>
          </div>
        </div>
        <div class="service reveal">
          <div class="service__icon" data-icon="strap"></div>
          <div>
            <h2 class="h3" data-i18n="svc.strap.title"></h2>
            <p data-i18n="svc.strap.text"></p>
            <span class="service__price" data-i18n="svc.ask"></span>
          </div>
        </div>
        <div class="service reveal">
          <div class="service__icon" data-icon="bracelet"></div>
          <div>
            <h2 class="h3" data-i18n="svc.bracelet.title"></h2>
            <p data-i18n="svc.bracelet.text"></p>
            <span class="service__price" data-i18n="svc.ask"></span>
          </div>
        </div>
        <div class="service reveal">
          <div class="service__icon" data-icon="check"></div>
          <div>
            <h2 class="h3" data-i18n="svc.check.title"></h2>
            <p data-i18n="svc.check.text"></p>
            <span class="service__price" data-i18n="svc.free"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap info-split">
      <div class="ph ph--dark ph--focus-low ratio-4-5 reveal" data-img="images/watchmaker-at-work.webp" data-alt="Inspecting a watch with a loupe at the Springwell Time counter"></div>
      <div class="reveal">
        <h2 class="display" data-i18n="band.title"></h2>
        <hr class="rule">
        <p class="lead" data-i18n="svc.note"></p>
        <div class="btn-row" style="margin-top:28px">
          <a class="btn" data-wa="wa.battery" href="#"><span data-icon="wa"></span><span data-i18n="svc.cta"></span></a>
          <a class="btn btn--ghost" href="visit.html" data-i18n="cta.visit"></a>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
